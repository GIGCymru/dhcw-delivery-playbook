# MkDocs configuration.
# This file also works with Zensical, which reads mkdocs.yml natively.
# Configured for GIGCymru/dhcw-delivery-playbook.

site_name: DHCW Product and Service Delivery Playbook
site_url: https://gigcymru.github.io/dhcw-delivery-playbook/
site_description: How DHCW builds healthy teams, and how those teams build and run digital services for the people of Wales.
site_author: Digital Health and Care Wales
copyright: "© 2026 Digital Health and Care Wales. Content available under the Open Government Licence v3.0."

# These three lines drive the "Edit this page" links and the repo button.
repo_url: https://github.com/GIGCymru/dhcw-delivery-playbook
repo_name: GitHub
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  # GIG CYMRU / NHS WALES masthead logo — white SVG, sits on the navy header.
  # Source: DHCW NHS Wales component library (docs/assets/nhsw-logo.svg).
  logo: assets/nhsw-logo.svg
  favicon: assets/favicon.ico
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/_tokens.css
  - stylesheets/extra.css

# Remove the default "Made with Material for MkDocs" generator notice.
extra:
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

# Grouped, hierarchical navigation mirroring the "shape of delivery" set out in
# docs/index.md. Sections render via the navigation.sections theme feature.
# Every page and filename is preserved; only grouping and label casing changed.
nav:
  - Home: index.md
  - Getting started:
      - Our values and ways of working: values-and-ways-of-working.md
      - The service lifecycle: service-lifecycle.md
      - Team roles: team-roles.md
      - Before Sprint 1: before-sprint-1.md
  - Designing for users:
      - Understanding users and their needs: understanding-users.md
      - Designing the whole service: whole-service-design.md
      - Accessibility and inclusion: accessibility-and-inclusion.md
  - Planning and running the work:
      - Backlog structure: backlog-structure.md
      - Definitions of Ready and Done: definition-of-ready-and-done.md
      - Ceremonies: ceremonies.md
      - Backlog management: backlog-management.md
  - Quality and risk:
      - Bug management: bug-management.md
      - Technical debt: technical-debt.md
      - Delivery plans and risk: delivery-plans-and-risk.md
      - Keeping services secure and safe: security-and-safety.md
  - Measurement and engineering:
      - Metrics and reporting: metrics-and-reporting.md
      - Measuring success: measuring-success.md
      - Engineering practice: engineering-practice.md
      - Working in the open: working-in-the-open.md
  - Running the service:
      - Running a reliable service: running-a-reliable-service.md
